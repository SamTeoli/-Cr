name: Apply deck selection ViewModel integration

on:
  push:
    branches:
      - agent/deck-selection-viewmodel

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deck-selection-viewmodel
          fetch-depth: 0

      - name: Replace local UI selection state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          runtime_path = Path("Assets/Scripts/Prototype/RuntimePrototypeScreen.cs")
          runtime = runtime_path.read_text(encoding="utf-8")
          runtime = replace_once(runtime, '''        private readonly List<string> deckEditingSelection = new();
                  private bool deckEditing;
                  private RunOwnedCardState runPreparationCards;
                  private readonly List<string> runPreparationSelection = new();
          ''', '''        private readonly RunDeckSelectionViewModel deckSelection = new();
                  private RunOwnedCardState runPreparationCards;
          ''', "runtime fields")
          runtime = replace_once(runtime, '''        private void DrawRunPreparation()
                  {
                      scroll = GUILayout.BeginScrollView(scroll);
                      GUILayout.Label("새 런 덱 준비", titleStyle);
                      GUILayout.Label(
                          "보유카드 중 이번 런에서 사용할 카드를 선택하세요. " +
                          "카드를 선택한 순서가 덱 순서가 됩니다.", wrappedStyle);
                      GUILayout.Space(12f);
                      GUILayout.Label($"선택 {runPreparationSelection.Count}장", headingStyle);
                      foreach (RunCardInstance card in runPreparationCards.Cards)
                      {
                          bool selected = runPreparationSelection.Contains(card.OwnedCardId);
                          if (!GUILayout.Button(
                                  $"{(selected ? "[편성]" : "[보유]")} " +
                                  $"{card.Card.DisplayName} · Lv.{card.CurrentLevel}")) continue;
                          if (selected) runPreparationSelection.Remove(card.OwnedCardId);
                          else runPreparationSelection.Add(card.OwnedCardId);
                      }

                      GUILayout.Space(12f);
                      GUILayout.BeginHorizontal();
                      if (GUILayout.Button("취소", GUILayout.Height(44f)))
                      {
                          CancelRunPreparation();
                      }
                      if (GUILayout.Button("이 덱으로 런 시작", GUILayout.Height(44f)))
                      {
                          ConfirmRunPreparation();
                      }
                      GUILayout.EndHorizontal();
                      DrawMessage();
                      GUILayout.EndScrollView();
                  }
          ''', '''        private void DrawRunPreparation()
                  {
                      scroll = GUILayout.BeginScrollView(scroll);
                      GUILayout.Label("새 런 덱 준비", titleStyle);
                      GUILayout.Label(
                          "보유카드 중 이번 런에서 사용할 카드를 선택하세요. " +
                          "카드를 선택한 순서가 덱 순서가 됩니다.", wrappedStyle);
                      GUILayout.Space(12f);
                      GUILayout.Label($"선택 {deckSelection.SelectedCount}장", headingStyle);
                      foreach (RunDeckSelectionOption option in
                               deckSelection.CreateOptions(runPreparationCards))
                      {
                          if (!GUILayout.Button(option.DisplayLabel)) continue;
                          deckSelection.Toggle(option.OwnedCardId);
                      }

                      GUILayout.Space(12f);
                      GUILayout.BeginHorizontal();
                      if (GUILayout.Button("취소", GUILayout.Height(44f)))
                      {
                          CancelRunPreparation();
                      }
                      if (GUILayout.Button("이 덱으로 런 시작", GUILayout.Height(44f)))
                      {
                          ConfirmRunPreparation();
                      }
                      GUILayout.EndHorizontal();
                      DrawMessage();
                      GUILayout.EndScrollView();
                  }
          ''', "runtime preparation UI")
          runtime = replace_once(runtime, '''        private void DrawDeckEditor()
                  {
                      if (progress.RunState.RunEnded) return;
                      GUILayout.Label("런 덱 편집", headingStyle);
                      if (!deckEditing)
                      {
                          if (GUILayout.Button("덱 편집 열기", GUILayout.Width(140f)))
                          {
                              deckEditingSelection.Clear();
                              deckEditingSelection.AddRange(
                                  progress.RunDeck.Cards.Select(card => card.OwnedCardId));
                              deckEditing = true;
                          }
                          return;
                      }

                      GUILayout.Label($"선택 {deckEditingSelection.Count}장");
                      foreach (RunCardInstance card in progress.OwnedCards.Cards)
                      {
                          bool selected = deckEditingSelection.Contains(card.OwnedCardId);
                          if (!GUILayout.Button(
                                  $"{(selected ? "[편성]" : "[보유]")} " +
                                  $"{card.Card.DisplayName} · Lv.{card.CurrentLevel}")) continue;
                          if (selected) deckEditingSelection.Remove(card.OwnedCardId);
                          else deckEditingSelection.Add(card.OwnedCardId);
                      }

                      GUILayout.BeginHorizontal();
                      if (GUILayout.Button("취소")) deckEditing = false;
                      if (GUILayout.Button("선택한 덱 적용")) ApplyDeckEditing();
                      GUILayout.EndHorizontal();
                  }

                  private void ApplyDeckEditing()
                  {
                      if (RunDeckSelectionService.TryReplaceDeck(
                              progress, deckEditingSelection, out RunDeckFailure failure))
                      {
                          deckEditing = false;
                          selectedUpgradeCardId = progress.RunDeck.Cards.FirstOrDefault()?.OwnedCardId;
                          message = $"런 덱을 {progress.RunDeck.Count}장으로 변경했습니다.";
                          SaveRun(null);
                          return;
                      }
                      message = $"런 덱 변경 실패: {failure}";
                  }
          ''', '''        private void DrawDeckEditor()
                  {
                      if (progress.RunState.RunEnded) return;
                      GUILayout.Label("런 덱 편집", headingStyle);
                      if (!deckSelection.IsOpen)
                      {
                          if (GUILayout.Button("덱 편집 열기", GUILayout.Width(140f)))
                          {
                              deckSelection.OpenFromDeck(progress.RunDeck);
                          }
                          return;
                      }

                      GUILayout.Label($"선택 {deckSelection.SelectedCount}장");
                      foreach (RunDeckSelectionOption option in
                               deckSelection.CreateOptions(progress.OwnedCards))
                      {
                          if (!GUILayout.Button(option.DisplayLabel)) continue;
                          deckSelection.Toggle(option.OwnedCardId);
                      }

                      GUILayout.BeginHorizontal();
                      if (GUILayout.Button("취소")) deckSelection.Close();
                      if (GUILayout.Button("선택한 덱 적용")) ApplyDeckEditing();
                      GUILayout.EndHorizontal();
                  }

                  private void ApplyDeckEditing()
                  {
                      if (deckSelection.TryApply(
                              progress, out RunDeckFailure failure))
                      {
                          selectedUpgradeCardId = progress.RunDeck.Cards.FirstOrDefault()?.OwnedCardId;
                          message = $"런 덱을 {progress.RunDeck.Count}장으로 변경했습니다.";
                          SaveRun(null);
                          return;
                      }
                      message = $"런 덱 변경 실패: {failure}";
                  }
          ''', "runtime deck editor")
          runtime = replace_once(runtime, '''            runPreparationCards = new RunOwnedCardState();
                      runPreparationSelection.Clear();
                      int index = 0;
                      foreach (CardData card in config.CardDatabase.Cards.Where(card => card != null))
                      {
                          RunCardInstance ownedCard = new(
                              card, $"OWNED-RUN-{++index:00}-{card.CatalogCardId}", 1);
                          if (!runPreparationCards.TryAdd(ownedCard, out _)) continue;
                          runPreparationSelection.Add(ownedCard.OwnedCardId);
                      }
                      scroll = Vector2.zero;
          ''', '''            runPreparationCards = new RunOwnedCardState();
                      int index = 0;
                      foreach (CardData card in config.CardDatabase.Cards.Where(card => card != null))
                      {
                          RunCardInstance ownedCard = new(
                              card, $"OWNED-RUN-{++index:00}-{card.CatalogCardId}", 1);
                          runPreparationCards.TryAdd(ownedCard, out _);
                      }
                      deckSelection.OpenWithAllOwnedCards(runPreparationCards);
                      scroll = Vector2.zero;
          ''', "runtime begin preparation")
          runtime = replace_once(runtime, '''            runPreparationCards = null;
                      runPreparationSelection.Clear();
                      scroll = Vector2.zero;
                      message = "새 런 준비를 취소했습니다.";
          ''', '''            runPreparationCards = null;
                      deckSelection.Close();
                      scroll = Vector2.zero;
                      message = "새 런 준비를 취소했습니다.";
          ''', "runtime cancel preparation")
          runtime = replace_once(runtime, '''            if (!RunDeckSelectionService.TryCreateDeck(
                              runPreparationCards, runPreparationSelection,
                              out RunDeckState deck, out RunDeckFailure failure))
          ''', '''            if (!deckSelection.TryCreateDeck(
                              runPreparationCards,
                              out RunDeckState deck, out RunDeckFailure failure))
          ''', "runtime confirm preparation")
          runtime = replace_once(runtime, '''            deckEditing = false;
                      deckEditingSelection.Clear();
                      runPreparationCards = null;
                      runPreparationSelection.Clear();
          ''', '''            deckSelection.Close();
                      runPreparationCards = null;
          ''', "runtime preparation reset")
          runtime = replace_once(runtime, '''            runPreparationCards = null;
                      runPreparationSelection.Clear();
                      LoadPermanentRewards();
          ''', '''            runPreparationCards = null;
                      deckSelection.Close();
                      LoadPermanentRewards();
          ''', "runtime continue reset")
          runtime = replace_once(runtime, '''            deckEditing = false;
                      deckEditingSelection.Clear();
                      scroll = Vector2.zero;
          ''', '''            deckSelection.Close();
                      scroll = Vector2.zero;
          ''', "runtime continue editor reset")
          runtime_path.write_text(runtime, encoding="utf-8")

          editor_path = Path("Assets/Editor/IntegratedRunPrototypeWindow.cs")
          editor = editor_path.read_text(encoding="utf-8")
          editor = replace_once(editor, '''        private readonly List<string> deckEditingSelection = new();
                  private bool deckEditing;
                  private RunOwnedCardState runPreparationCards;
                  private readonly List<string> runPreparationSelection = new();
          ''', '''        private readonly RunDeckSelectionViewModel deckSelection = new();
                  private RunOwnedCardState runPreparationCards;
          ''', "editor fields")
          editor = replace_once(editor, '''        private void DrawRunPreparation()
                  {
                      scroll = EditorGUILayout.BeginScrollView(scroll);
                      EditorGUILayout.LabelField("새 런 덱 준비", EditorStyles.largeLabel);
                      EditorGUILayout.HelpBox(
                          "보유카드 중 이번 런에서 사용할 카드를 선택하세요. " +
                          "카드를 선택한 순서가 덱 순서가 됩니다.",
                          MessageType.Info);
                      EditorGUILayout.LabelField(
                          $"선택 {runPreparationSelection.Count}장",
                          EditorStyles.boldLabel);
                      foreach (RunCardInstance card in runPreparationCards.Cards)
                      {
                          bool selected = runPreparationSelection.Contains(card.OwnedCardId);
                          if (!GUILayout.Button(
                                  $"{(selected ? "[편성]" : "[보유]")} " +
                                  $"{card.Card.DisplayName} · Lv.{card.CurrentLevel}")) continue;
                          if (selected) runPreparationSelection.Remove(card.OwnedCardId);
                          else runPreparationSelection.Add(card.OwnedCardId);
                      }

                      EditorGUILayout.Space(8f);
                      EditorGUILayout.BeginHorizontal();
                      if (GUILayout.Button("취소", GUILayout.Height(40f)))
                      {
                          CancelRunPreparation();
                      }
                      if (GUILayout.Button("이 덱으로 런 시작", GUILayout.Height(40f)))
                      {
                          ConfirmRunPreparation();
                      }
                      EditorGUILayout.EndHorizontal();
                      DrawMessage();
                      EditorGUILayout.EndScrollView();
                  }
          ''', '''        private void DrawRunPreparation()
                  {
                      scroll = EditorGUILayout.BeginScrollView(scroll);
                      EditorGUILayout.LabelField("새 런 덱 준비", EditorStyles.largeLabel);
                      EditorGUILayout.HelpBox(
                          "보유카드 중 이번 런에서 사용할 카드를 선택하세요. " +
                          "카드를 선택한 순서가 덱 순서가 됩니다.",
                          MessageType.Info);
                      EditorGUILayout.LabelField(
                          $"선택 {deckSelection.SelectedCount}장",
                          EditorStyles.boldLabel);
                      foreach (RunDeckSelectionOption option in
                               deckSelection.CreateOptions(runPreparationCards))
                      {
                          if (!GUILayout.Button(option.DisplayLabel)) continue;
                          deckSelection.Toggle(option.OwnedCardId);
                      }

                      EditorGUILayout.Space(8f);
                      EditorGUILayout.BeginHorizontal();
                      if (GUILayout.Button("취소", GUILayout.Height(40f)))
                      {
                          CancelRunPreparation();
                      }
                      if (GUILayout.Button("이 덱으로 런 시작", GUILayout.Height(40f)))
                      {
                          ConfirmRunPreparation();
                      }
                      EditorGUILayout.EndHorizontal();
                      DrawMessage();
                      EditorGUILayout.EndScrollView();
                  }
          ''', "editor preparation UI")
          editor = replace_once(editor, '''        private void DrawDeckEditor()
                  {
                      if (progress.RunState.RunEnded) return;
                      EditorGUILayout.LabelField("런 덱 편집", EditorStyles.miniBoldLabel);
                      if (!deckEditing)
                      {
                          if (GUILayout.Button("덱 편집 열기"))
                          {
                              deckEditingSelection.Clear();
                              deckEditingSelection.AddRange(
                                  progress.RunDeck.Cards.Select(card => card.OwnedCardId));
                              deckEditing = true;
                          }
                          return;
                      }

                      EditorGUILayout.LabelField($"선택 {deckEditingSelection.Count}장");
                      foreach (RunCardInstance card in progress.OwnedCards.Cards)
                      {
                          bool selected = deckEditingSelection.Contains(card.OwnedCardId);
                          if (!GUILayout.Button(
                                  $"{(selected ? "[편성]" : "[보유]")} " +
                                  $"{card.Card.DisplayName} · Lv.{card.CurrentLevel}")) continue;
                          if (selected) deckEditingSelection.Remove(card.OwnedCardId);
                          else deckEditingSelection.Add(card.OwnedCardId);
                      }

                      EditorGUILayout.BeginHorizontal();
                      if (GUILayout.Button("취소")) deckEditing = false;
                      if (GUILayout.Button("선택한 덱 적용")) ApplyDeckEditing();
                      EditorGUILayout.EndHorizontal();
                  }

                  private void ApplyDeckEditing()
                  {
                      if (RunDeckSelectionService.TryReplaceDeck(
                              progress, deckEditingSelection, out RunDeckFailure failure))
                      {
                          deckEditing = false;
                          selectedUpgradeCardId =
                              progress.RunDeck.Cards.FirstOrDefault()?.OwnedCardId;
                          message = $"런 덱을 {progress.RunDeck.Count}장으로 변경했습니다.";
                          SaveRun(null);
                          return;
                      }
                      message = $"런 덱 변경 실패: {failure}";
                  }
          ''', '''        private void DrawDeckEditor()
                  {
                      if (progress.RunState.RunEnded) return;
                      EditorGUILayout.LabelField("런 덱 편집", EditorStyles.miniBoldLabel);
                      if (!deckSelection.IsOpen)
                      {
                          if (GUILayout.Button("덱 편집 열기"))
                          {
                              deckSelection.OpenFromDeck(progress.RunDeck);
                          }
                          return;
                      }

                      EditorGUILayout.LabelField($"선택 {deckSelection.SelectedCount}장");
                      foreach (RunDeckSelectionOption option in
                               deckSelection.CreateOptions(progress.OwnedCards))
                      {
                          if (!GUILayout.Button(option.DisplayLabel)) continue;
                          deckSelection.Toggle(option.OwnedCardId);
                      }

                      EditorGUILayout.BeginHorizontal();
                      if (GUILayout.Button("취소")) deckSelection.Close();
                      if (GUILayout.Button("선택한 덱 적용")) ApplyDeckEditing();
                      EditorGUILayout.EndHorizontal();
                  }

                  private void ApplyDeckEditing()
                  {
                      if (deckSelection.TryApply(
                              progress, out RunDeckFailure failure))
                      {
                          selectedUpgradeCardId =
                              progress.RunDeck.Cards.FirstOrDefault()?.OwnedCardId;
                          message = $"런 덱을 {progress.RunDeck.Count}장으로 변경했습니다.";
                          SaveRun(null);
                          return;
                      }
                      message = $"런 덱 변경 실패: {failure}";
                  }
          ''', "editor deck editor")
          editor = replace_once(editor, '''            runPreparationCards = new RunOwnedCardState();
                      runPreparationSelection.Clear();
                      int index = 0;
                      foreach (CardData card in cardDatabase.Cards.Where(card => card != null))
                      {
                          RunCardInstance ownedCard = new(
                              card, $"OWNED-RUN-{++index:00}-{card.CatalogCardId}", 1);
                          if (!runPreparationCards.TryAdd(ownedCard, out _)) continue;
                          runPreparationSelection.Add(ownedCard.OwnedCardId);
                      }

                      scroll = Vector2.zero;
          ''', '''            runPreparationCards = new RunOwnedCardState();
                      int index = 0;
                      foreach (CardData card in cardDatabase.Cards.Where(card => card != null))
                      {
                          RunCardInstance ownedCard = new(
                              card, $"OWNED-RUN-{++index:00}-{card.CatalogCardId}", 1);
                          runPreparationCards.TryAdd(ownedCard, out _);
                      }
                      deckSelection.OpenWithAllOwnedCards(runPreparationCards);

                      scroll = Vector2.zero;
          ''', "editor begin preparation")
          editor = replace_once(editor, '''            runPreparationCards = null;
                      runPreparationSelection.Clear();
                      scroll = Vector2.zero;
                      message = "새 런 준비를 취소했습니다.";
          ''', '''            runPreparationCards = null;
                      deckSelection.Close();
                      scroll = Vector2.zero;
                      message = "새 런 준비를 취소했습니다.";
          ''', "editor cancel preparation")
          editor = replace_once(editor, '''            if (!RunDeckSelectionService.TryCreateDeck(
                              runPreparationCards, runPreparationSelection,
                              out RunDeckState deck, out RunDeckFailure failure))
          ''', '''            if (!deckSelection.TryCreateDeck(
                              runPreparationCards,
                              out RunDeckState deck, out RunDeckFailure failure))
          ''', "editor confirm preparation")
          editor = replace_once(editor, '''            deckEditing = false;
                      deckEditingSelection.Clear();
                      runPreparationCards = null;
                      runPreparationSelection.Clear();
          ''', '''            deckSelection.Close();
                      runPreparationCards = null;
          ''', "editor preparation reset")
          editor = replace_once(editor, '''            runPreparationCards = null;
                      runPreparationSelection.Clear();
                      LoadPermanentRewards();
          ''', '''            runPreparationCards = null;
                      deckSelection.Close();
                      LoadPermanentRewards();
          ''', "editor continue reset")
          editor = replace_once(editor, '''            deckEditing = false;
                      deckEditingSelection.Clear();
                      SelectFirstEnemy();
          ''', '''            deckSelection.Close();
                      SelectFirstEnemy();
          ''', "editor continue editor reset")
          editor_path.write_text(editor, encoding="utf-8")
          PY

      - name: Commit integrated screens
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No integration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/Scripts/Prototype/RuntimePrototypeScreen.cs Assets/Editor/IntegratedRunPrototypeWindow.cs
          git commit -m "덱 선택 ViewModel을 프로토타입 화면에 연결"
          git push origin HEAD:agent/deck-selection-viewmodel
