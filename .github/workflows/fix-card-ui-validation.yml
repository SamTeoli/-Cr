name: 카드 UI 검증 기준 갱신

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  update-validation:
    if: github.event.pull_request.head.ref == 'codex/card-visual-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/card-visual-foundation
          fetch-depth: 0

      - name: 현재 카드 UI 구조에 맞게 검증 수정
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('Assets/Editor/RuntimeGameUiRootValidation.cs')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              'ArtPlaceholderText.text == "아트 자리"',
              'ArtPlaceholderText.text == "일러스트"')
          text = text.replace(
              'preparationCard.MetadataText.text.Contains("스킬")',
              'preparationCard.MetadataText.text == "스킬"')
          text = text.replace(
              'preparationCard.MetadataText.text.Contains("일반")',
              'preparationCard.Presentation.Rarity == CardRarity.Common')
          text = text.replace(
              'preparationCard.SelectionText.text == "[선택 1번]"',
              'preparationCard.SelectionText.text == "선택 1"')

          text = re.sub(
              r'(?m)^(\s*)preparationCard\.FrameImage\.color !=\s*\n\s*preparationCard\.Presentation\.TypeColor &&',
              lambda m: (
                  f'{m.group(1)}preparationCard.FrameOverlayImage != null &&\n'
                  f'{m.group(1)}(preparationCard.FrameOverlayImage.sprite != null ||\n'
                  f'{m.group(1)} preparationCard.FrameImage.color != Color.clear) &&'),
              text)

          text = text.replace(
              'activeCard.MetadataText.text.Contains("전설") &&',
              'activeCard.MetadataText.text == "스킬" &&\n'
              '                    activeCard.Presentation.Rarity == CardRarity.Legendary &&')
          text = re.sub(
              r'(?m)^(\s*)activeCard\.FrameImage\.color ==\s*\n\s*battleCards\[0\]\.TypeColor &&\s*\n\s*activeCard\.RarityAccentImage\.color ==\s*\n\s*battleCards\[0\]\.RarityColor &&',
              lambda m: (
                  f'{m.group(1)}activeCard.FrameOverlayImage != null &&\n'
                  f'{m.group(1)}(activeCard.FrameOverlayImage.sprite != null ||\n'
                  f'{m.group(1)} activeCard.FrameImage.color != Color.clear) &&\n'
                  f'{m.group(1)}!activeCard.RarityAccentImage.gameObject.activeSelf &&'),
              text)

          text = text.replace(
              'blockedCard.StatsText.text == "공격 4  생명 5"',
              'blockedCard.StatsText.text == "공격 4, 생명력 5"')
          text = text.replace(
              'blockedCard.MetadataText.text.Contains("희귀") &&',
              'blockedCard.MetadataText.text == "몬스터" &&\n'
              '                    blockedCard.Presentation.Rarity == CardRarity.Rare &&')
          text = re.sub(
              r'(?m)^(\s*)blockedCard\.FrameImage\.color !=\s*\n\s*battleCards\[1\]\.TypeColor &&\s*\n\s*battleCards\[0\]\.TypeColor != battleCards\[1\]\.TypeColor &&\s*\n\s*battleCards\[0\]\.RarityColor !=\s*\n\s*battleCards\[1\]\.RarityColor &&',
              lambda m: (
                  f'{m.group(1)}blockedCard.FrameOverlayImage != null &&\n'
                  f'{m.group(1)}(blockedCard.FrameOverlayImage.sprite != null ||\n'
                  f'{m.group(1)} blockedCard.FrameImage.color != Color.clear) &&'),
              text)

          text = text.replace(
              '                    root.BattleMessageText.text == "전투 명령 메시지" &&',
              '                    root.BattleMessageText.text.StartsWith(\n'
              '                        "전투 명령 메시지",\n'
              '                        StringComparison.Ordinal) &&\n'
              '                    root.BattleMessageText.text.Contains("드래그") &&')
          text = text.replace(
              '"type and rarity colors, selection and disabled states, " +',
              '"type labels and rarity frames, selection and disabled states, " +')

          required = [
              'ArtPlaceholderText.text == "일러스트"',
              'preparationCard.Presentation.Rarity == CardRarity.Common',
              'activeCard.Presentation.Rarity == CardRarity.Legendary',
              'blockedCard.Presentation.Rarity == CardRarity.Rare',
              'root.BattleMessageText.text.Contains("드래그")',
          ]
          missing = [value for value in required if value not in text]
          if missing:
              raise SystemExit(f'missing updated markers: {missing}')

          path.write_text(text, encoding='utf-8', newline='\n')
          PY

          git add Assets/Editor/RuntimeGameUiRootValidation.cs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "현재 카드 구조에 맞게 UGUI 검증 갱신"
          git push origin HEAD:codex/card-visual-foundation
