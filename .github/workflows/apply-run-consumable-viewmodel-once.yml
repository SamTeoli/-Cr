name: Apply run consumable ViewModel once

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/deck-selection-viewmodel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deck-selection-viewmodel
          fetch-depth: 0

      - name: Connect run consumable ViewModel
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          def replace_section(text, start, end, replacement, label):
              start_index = text.find(start)
              if start_index < 0:
                  raise RuntimeError(f"{label}: start marker missing")
              end_index = text.find(end, start_index)
              if end_index < 0:
                  raise RuntimeError(f"{label}: end marker missing")
              return text[:start_index] + replacement + text[end_index:]

          runtime_path = Path("Assets/Scripts/Prototype/RuntimePrototypeScreen.cs")
          runtime = runtime_path.read_text(encoding="utf-8")
          runtime = replace_once(
              runtime,
              "        private readonly RunBattleRewardViewModel battleReward = new();\n",
              "        private readonly RunBattleRewardViewModel battleReward = new();\n"
              "        private readonly RunConsumableViewModel runConsumables = new();\n",
              "runtime ViewModel field")
          runtime_block = '''        private void DrawRunInventory()
        {
            GUILayout.Label("런 소모아이템", headingStyle);
            RunConsumableInventoryOption[] inventory =
                runConsumables.CreateInventoryOptions(progress);
            GUILayout.Label(inventory.Length == 0
                ? "보유 아이템 없음"
                : string.Join(", ", inventory.Select(option =>
                    option.DisplayLabel)));

            RunEnchantHammerTargetOption selected =
                runConsumables.SelectedHammerTarget(
                    progress,
                    selectedUpgradeCardId);
            if (selected != null)
            {
                selectedUpgradeCardId = selected.OwnedCardId;
                GUILayout.BeginHorizontal(GUI.skin.box);
                string blockText = string.IsNullOrWhiteSpace(selected.BlockReason)
                    ? string.Empty
                    : $" · {selected.BlockReason}";
                GUILayout.Label($"망치 대상: {selected.DisplayLabel}{blockText}");
                if (GUILayout.Button("다음 카드", GUILayout.Width(100f)))
                {
                    selected = runConsumables.CycleHammerTarget(
                        progress,
                        selectedUpgradeCardId);
                    selectedUpgradeCardId = selected?.OwnedCardId;
                }

                bool previous = GUI.enabled;
                GUI.enabled = selected?.CanUse == true;
                if (GUILayout.Button("인첸트 슬롯 +1", GUILayout.Width(140f)))
                {
                    if (runConsumables.TryUseEnchantHammer(
                            progress,
                            selectedUpgradeCardId,
                            out RunEnchantHammerTargetOption used,
                            out string result,
                            out PrototypeConsumableFailure failure))
                    {
                        selectedUpgradeCardId = used.OwnedCardId;
                        message = result;
                        SaveRun(null);
                    }
                    else
                    {
                        message = $"인첸트 망치 사용 실패: {failure}";
                    }
                }
                GUI.enabled = previous;
                GUILayout.EndHorizontal();
            }

            DrawMutationScroll();
        }

        private void DrawMutationScroll()
        {
            RunMutationScrollOption[] options =
                runConsumables.CreateMutationOptions(
                    progress,
                    config.EnchantDatabase.Enchants);
            if (options.Length == 0)
            {
                return;
            }

            GUILayout.Label("변이 주문서", headingStyle);
            foreach (RunMutationScrollOption option in options)
            {
                bool previous = GUI.enabled;
                GUI.enabled = option.CanUse;
                bool clicked = GUILayout.Button(option.DisplayText);
                GUI.enabled = previous;
                if (!clicked)
                {
                    continue;
                }

                if (runConsumables.TryUseMutationScroll(
                        progress,
                        config.EnchantDatabase.Enchants,
                        option.OwnedCardId,
                        option.SlotIndex,
                        option.ReplacementDefinitionId,
                        out _,
                        out string result,
                        out EnchantAttachmentFailure attachmentFailure,
                        out PrototypeConsumableFailure failure))
                {
                    message = result;
                    SaveRun(null);
                    return;
                }

                message =
                    $"변이 주문서 사용 실패: {failure} / {attachmentFailure}";
            }
        }

'''
          runtime = replace_section(
              runtime,
              "        private void DrawRunInventory()\n",
              "        private void DrawNodeSelection()\n",
              runtime_block,
              "runtime inventory methods")
          runtime_path.write_text(runtime, encoding="utf-8")

          editor_path = Path("Assets/Editor/IntegratedRunPrototypeWindow.cs")
          editor = editor_path.read_text(encoding="utf-8")
          editor = replace_once(
              editor,
              "        private readonly RunBattleRewardViewModel battleReward = new();\n",
              "        private readonly RunBattleRewardViewModel battleReward = new();\n"
              "        private readonly RunConsumableViewModel runConsumables = new();\n",
              "editor ViewModel field")
          editor_block = '''        private void DrawRunInventory()
        {
            EditorGUILayout.LabelField(
                "런 소모아이템",
                EditorStyles.miniBoldLabel);
            RunConsumableInventoryOption[] inventory =
                runConsumables.CreateInventoryOptions(progress);
            EditorGUILayout.LabelField(inventory.Length == 0
                ? "보유 아이템 없음"
                : string.Join(", ", inventory.Select(option =>
                    option.DisplayLabel)));

            RunEnchantHammerTargetOption[] targets =
                runConsumables.CreateHammerTargets(
                    progress,
                    selectedUpgradeCardId);
            if (targets.Length > 0)
            {
                int selectedIndex = Mathf.Max(
                    0,
                    Array.FindIndex(targets, option => option.IsSelected));
                string[] labels = targets
                    .Select(option => string.IsNullOrWhiteSpace(option.BlockReason)
                        ? option.DisplayLabel
                        : $"{option.DisplayLabel} · {option.BlockReason}")
                    .ToArray();
                int nextIndex = EditorGUILayout.Popup(
                    "인첸트 망치 대상",
                    selectedIndex,
                    labels);
                if (nextIndex >= 0 && nextIndex < targets.Length &&
                    runConsumables.SelectHammerTarget(
                        progress,
                        targets[nextIndex].OwnedCardId))
                {
                    selectedUpgradeCardId = targets[nextIndex].OwnedCardId;
                }

                RunEnchantHammerTargetOption selected =
                    runConsumables.SelectedHammerTarget(
                        progress,
                        selectedUpgradeCardId);
                using (new EditorGUI.DisabledScope(
                           selected?.CanUse != true))
                {
                    if (GUILayout.Button("인첸트 망치 사용 · 슬롯 +1"))
                    {
                        if (runConsumables.TryUseEnchantHammer(
                                progress,
                                selectedUpgradeCardId,
                                out RunEnchantHammerTargetOption used,
                                out string result,
                                out PrototypeConsumableFailure failure))
                        {
                            selectedUpgradeCardId = used.OwnedCardId;
                            message = result;
                            SaveRun(null);
                        }
                        else
                        {
                            message = $"인첸트 망치 사용 실패: {failure}";
                        }
                    }
                }
            }

            DrawMutationScroll();
        }

        private void DrawMutationScroll()
        {
            RunMutationScrollOption[] options =
                runConsumables.CreateMutationOptions(
                    progress,
                    enchantDatabase.Enchants);
            if (options.Length == 0)
            {
                return;
            }

            EditorGUILayout.LabelField(
                "변이 주문서",
                EditorStyles.miniBoldLabel);
            foreach (RunMutationScrollOption option in options)
            {
                using (new EditorGUI.DisabledScope(!option.CanUse))
                {
                    if (!GUILayout.Button(option.DisplayText))
                    {
                        continue;
                    }
                }

                if (runConsumables.TryUseMutationScroll(
                        progress,
                        enchantDatabase.Enchants,
                        option.OwnedCardId,
                        option.SlotIndex,
                        option.ReplacementDefinitionId,
                        out _,
                        out string result,
                        out EnchantAttachmentFailure attachmentFailure,
                        out PrototypeConsumableFailure failure))
                {
                    message = result;
                    SaveRun(null);
                    return;
                }

                message =
                    $"변이 주문서 사용 실패: {failure} / {attachmentFailure}";
            }
        }

'''
          editor = replace_section(
              editor,
              "        private void DrawRunInventory()\n",
              "        private void DrawNodeSelection()\n",
              editor_block,
              "editor inventory methods")
          editor_path.write_text(editor, encoding="utf-8")

          harness_path = Path(
              "Assets/Editor/BattleRuntimeFullRegressionValidation.cs")
          harness = harness_path.read_text(encoding="utf-8")
          marker = (
              '            valid &= Run(\n'
              '                "Run rest upgrade ViewModel and command flow",\n'
              '                RunRestUpgradeViewModelValidation.Validate);\n')
          insertion = marker + (
              '            valid &= Run(\n'
              '                "Run consumable ViewModel and mutation flow",\n'
              '                RunConsumableViewModelValidation.Validate);\n')
          harness = replace_once(
              harness,
              marker,
              insertion,
              "full regression registration")
          harness_path.write_text(harness, encoding="utf-8")
          PY

          rm -f .github/workflows/apply-run-consumable-viewmodel-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/Scripts/Prototype/RuntimePrototypeScreen.cs \
                  Assets/Editor/IntegratedRunPrototypeWindow.cs \
                  Assets/Editor/BattleRuntimeFullRegressionValidation.cs \
                  .github/workflows/apply-run-consumable-viewmodel-once.yml
          git diff --cached --check
          git commit -m "런 소모아이템 ViewModel 화면 연결"
          git push origin HEAD:agent/deck-selection-viewmodel
