name: Apply situation event ViewModel once

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/deck-selection-viewmodel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deck-selection-viewmodel
          fetch-depth: 0

      - name: Connect situation event ViewModel
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          def replace_exact(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          def format_method(value):
              return textwrap.indent(textwrap.dedent(value).strip(), "        ")

          def replace_method(text, name, replacement):
              start_token = f"        private void {name}("
              start = text.index(start_token)
              end = text.find("\n        private ", start + len(start_token))
              if end < 0:
                  raise RuntimeError(f"next method not found after {name}")
              return text[:start] + format_method(replacement) + "\n" + text[end:]

          runtime_path = Path("Assets/Scripts/Prototype/RuntimePrototypeScreen.cs")
          runtime = runtime_path.read_text(encoding="utf-8")
          runtime = replace_exact(
              runtime,
              "        private readonly RunNodeSelectionViewModel nodeSelection = new();\n",
              "        private readonly RunNodeSelectionViewModel nodeSelection = new();\n"
              "        private readonly RunSituationEventViewModel situationEvent = new();\n",
              "runtime situation event field")
          runtime = replace_method(runtime, "DrawSituationEvent", '''
          private void DrawSituationEvent()
          {
              GUILayout.Label("상황 이벤트", headingStyle);
              RunSituationEventOption[] options =
                  situationEvent.CreateOptions(campaign);
              foreach (RunSituationEventOption option in options)
              {
                  if (!GUILayout.Button(
                          option.DisplayText,
                          GUILayout.Height(42f))) continue;
                  if (situationEvent.TryResolve(
                          campaign,
                          progress.RunState,
                          option.ChoiceId,
                          out _,
                          out string result,
                          out RunCampaignFailure failure))
                  {
                      message = result;
                      SaveRun(null);
                      return;
                  }

                  message = $"이벤트 처리 실패: {failure}";
              }
          }
          ''')
          runtime_path.write_text(runtime, encoding="utf-8")

          editor_path = Path("Assets/Editor/IntegratedRunPrototypeWindow.cs")
          editor = editor_path.read_text(encoding="utf-8")
          editor = replace_exact(
              editor,
              "        private readonly RunNodeSelectionViewModel nodeSelection = new();\n",
              "        private readonly RunNodeSelectionViewModel nodeSelection = new();\n"
              "        private readonly RunSituationEventViewModel situationEvent = new();\n",
              "editor situation event field")
          editor = replace_method(editor, "DrawSituationEvent", '''
          private void DrawSituationEvent()
          {
              EditorGUILayout.LabelField(
                  "상황 이벤트",
                  EditorStyles.boldLabel);
              RunSituationEventOption[] options =
                  situationEvent.CreateOptions(campaign);
              foreach (RunSituationEventOption option in options)
              {
                  if (!GUILayout.Button(
                          option.DisplayText,
                          GUILayout.Height(36f))) continue;
                  if (situationEvent.TryResolve(
                          campaign,
                          progress.RunState,
                          option.ChoiceId,
                          out _,
                          out string result,
                          out RunCampaignFailure failure))
                  {
                      message = result;
                      SaveRun(null);
                      return;
                  }

                  message = $"이벤트 처리 실패: {failure}";
              }
          }
          ''')
          editor_path.write_text(editor, encoding="utf-8")

          harness_path = Path("Assets/Editor/BattleRuntimeFullRegressionValidation.cs")
          harness = harness_path.read_text(encoding="utf-8")
          marker = '''            valid &= Run(
              "Run deck encounter flow integration",'''
          block = '''            valid &= Run(
              "Run situation event ViewModel and resolution flow",
              RunSituationEventViewModelValidation.Validate);
          '''
          harness = replace_exact(
              harness,
              marker,
              block + marker,
              "full regression situation event registration")
          harness_path.write_text(harness, encoding="utf-8")
          PY

          rm -f .github/workflows/apply-situation-event-viewmodel-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/Scripts/Prototype/RuntimePrototypeScreen.cs \
                  Assets/Editor/IntegratedRunPrototypeWindow.cs \
                  Assets/Editor/BattleRuntimeFullRegressionValidation.cs \
                  .github/workflows/apply-situation-event-viewmodel-once.yml
          git diff --cached --check
          git commit -m "상황 이벤트 ViewModel 화면 연결"
          git push origin HEAD:agent/deck-selection-viewmodel
