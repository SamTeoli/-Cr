name: Fix shop label escapes once

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/deck-selection-viewmodel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deck-selection-viewmodel
          fetch-depth: 0

      - name: Fix CSharp label escapes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          paths = [
              Path("Assets/Scripts/Prototype/RuntimePrototypeScreen.cs"),
              Path("Assets/Editor/IntegratedRunPrototypeWindow.cs"),
          ]
          patterns = [
              (
                  r'\? string\.Empty : \$"\n\s*장착 대상: \{option\.TargetLabel\}";',
                  '? string.Empty : $"\\n장착 대상: {option.TargetLabel}";'
              ),
              (
                  r'\? string\.Empty : \$"\n\s*\{option\.BlockReason\}";',
                  '? string.Empty : $"\\n{option.BlockReason}";'
              ),
          ]

          for path in paths:
              text = path.read_text(encoding="utf-8")
              for pattern, replacement in patterns:
                  text, count = re.subn(
                      pattern,
                      lambda _: replacement,
                      text,
                      count=1)
                  if count != 1:
                      raise RuntimeError(
                          f"{path}: expected one match for {pattern}, found {count}")
              path.write_text(text, encoding="utf-8")
          PY

          rm -f .github/workflows/fix-shop-label-escapes-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/Scripts/Prototype/RuntimePrototypeScreen.cs \
                  Assets/Editor/IntegratedRunPrototypeWindow.cs \
                  .github/workflows/fix-shop-label-escapes-once.yml
          git diff --cached --check
          git commit -m "상점 보조 문구 이스케이프 수정"
          git push origin HEAD:agent/deck-selection-viewmodel
