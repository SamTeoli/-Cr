name: Inspect monster placement API

on:
  pull_request:
    types: [reopened]
    branches:
      - codex/card-visual-foundation

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Write placement API report
        shell: bash
        run: |
          report=MonsterPlacementApiReport.txt
          {
            echo '=== Player monster position references ==='
            grep -R -n -C 20 --include='*.cs' 'PlayerMonsterPositions\|PlayerMonsterFieldPosition' Assets/Scripts Assets/Editor || true
            echo '=== Card action service definitions ==='
            grep -R -n -C 50 --include='*.cs' 'class BattleRuntimePlayerCardActionService\|class BattleRuntimeCardPlayService' Assets/Scripts || true
            echo '=== Position mutation candidates ==='
            grep -R -n -C 15 --include='*.cs' 'TryPlace\|TryAssign\|TrySet\|TryMove\|SetOccupant\|RemoveOccupant\|TryRegister' Assets/Scripts || true
          } > "$report"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$report"
          git commit -m '임시: 몬스터 배치 API 검사 결과 기록'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
