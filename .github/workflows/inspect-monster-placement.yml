name: Apply selectable monster placement

on:
  pull_request:
    types: [reopened]
    branches:
      - codex/card-visual-foundation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Connect selected monster slot command
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def load(path):
              return Path(path).read_text(encoding='utf-8')

          def save(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='\n')

          path = 'Assets/Scripts/Prototype/BattlePlayerActionViewModel.cs'
          text = load(path)
          if 'PlayerMonsterFieldPosition? monsterPosition' not in text:
              start = text.index('        public BattleCardPlayCommandResult TryPlayCard(')
              end = text.index('        public BattleMonsterAttackActionOption[] CreateMonsterAttackOptions(', start)
              method = '''        public BattleCardPlayCommandResult TryPlayCard(
              BattleRuntimeEncounterContext context,
              string battleCardId)
          {
              return TryPlayCard(context, battleCardId, null);
          }

          public BattleCardPlayCommandResult TryPlayCard(
              BattleRuntimeEncounterContext context,
              string battleCardId,
              PlayerMonsterFieldPosition? monsterPosition)
          {
              BattleHandCardActionOption option = CreateHandOptions(context)
                  .FirstOrDefault(value => string.Equals(
                      value.BattleCardId,
                      battleCardId,
                      StringComparison.OrdinalIgnoreCase));
              if (option == null)
              {
                  return new BattleCardPlayCommandResult(
                      false, null, null, default, default, default,
                      context?.Session?.Outcome ?? BattleOutcome.Ongoing,
                      "카드 사용 실패: 선택한 카드를 현재 패에서 찾을 수 없습니다.");
              }
              if (!option.CanPlay)
              {
                  return new BattleCardPlayCommandResult(
                      false, option, null,
                      option.ActionFailure, option.PlayFailure, option.CardFailure,
                      context?.Session?.Outcome ?? BattleOutcome.Ongoing,
                      $"카드 사용 실패: {option.BlockReason}");
              }
              if (!BattleRuntimePlayerCardActionService.TryResolve(
                      context.Runtime,
                      option.BattleCardId,
                      selectedEnemyId,
                      option.SelectedBanishTargetId,
                      monsterPosition,
                      out BattleRuntimePlayerCardActionResult result,
                      out BattleRuntimePlayerCardActionFailure actionFailure,
                      out BattleRuntimeCardPlayFailure playFailure,
                      out CardPlayFailure cardFailure))
              {
                  string positionText = monsterPosition.HasValue
                      ? $" / 몬스터존 {monsterPosition.Value}"
                      : string.Empty;
                  return new BattleCardPlayCommandResult(
                      false, option, null,
                      actionFailure, playFailure, cardFailure,
                      context?.Session?.Outcome ?? BattleOutcome.Ongoing,
                      $"카드 사용 실패{positionText}: {actionFailure} / " +
                      $"{playFailure} / {cardFailure}");
              }
              selectedBanishCardIds.Remove(option.BattleCardId);
              BattleOutcome outcome = FinalizeOutcome(context);
              Refresh(context);
              string message = monsterPosition.HasValue
                  ? $"{result.Play.Card.SourceCard.DisplayName} 사용 완료 · " +
                    $"몬스터존 {monsterPosition.Value}"
                  : $"{result.Play.Card.SourceCard.DisplayName} 사용 완료.";
              if (outcome != BattleOutcome.Ongoing)
              {
                  message += $" 전투 종료 · {outcome}";
              }
              return new BattleCardPlayCommandResult(
                  true, option, result,
                  actionFailure, playFailure, cardFailure,
                  outcome, message);
          }

          '''
              text = text[:start] + method + text[end:]
              save(path, text)

          path = 'Assets/Scripts/Prototype/BattleScreenViewModel.Core.cs'
          text = load(path)
          if 'string battleCardId,\n            PlayerMonsterFieldPosition position)' not in text:
              marker = '        public BattleMonsterAttackCommandResult TryAttack(\n'
              addition = '''        public BattleCardPlayCommandResult TryPlayCard(
              RunEncounterProgressState progress,
              string battleCardId,
              PlayerMonsterFieldPosition position)
          {
              return actions.TryPlayCard(
                  progress?.ActiveEncounter,
                  battleCardId,
                  position);
          }

          '''
              if marker not in text:
                  raise RuntimeError('BattleScreenViewModel attack marker missing')
              text = text.replace(marker, addition + marker, 1)
              save(path, text)

          path = 'Assets/Scripts/Prototype/RuntimePrototypeScreen.FinalUi.cs'
          text = load(path)
          if 'TryExecuteFinalFieldCardDrop(' not in text:
              method_start = text.index('        private void ExecuteFinalBattleCardDrop(')
              body_start = text.index('        {', method_start) + len('        {')
              hook = '''
              if (TryExecuteFinalFieldCardDrop(
                      cardCommandId,
                      targetCommandId))
              {
                  return;
              }
          '''
              text = text[:body_start] + hook + text[body_start:]
              save(path, text)

          path = 'Assets/Scripts/Prototype/RuntimePrototypeScreen.BattleField.cs'
          text = load(path)
          if 'private bool TryExecuteFinalFieldCardDrop(' not in text:
              marker = '        private static string CreateBattleFieldSignature(\n'
              method = '''        private bool TryExecuteFinalFieldCardDrop(
              string cardCommandId,
              string targetCommandId)
          {
              if (!TryReadCommandValue(
                      targetCommandId,
                      "field:monster:",
                      out string slotText))
              {
                  return false;
              }
              if (!TryResolveMonsterPosition(
                      slotText,
                      out PlayerMonsterFieldPosition position))
              {
                  message = $"몬스터 소환 실패: 잘못된 몬스터존 {slotText}";
                  return true;
              }
              if (!TryReadCommandValue(
                      cardCommandId,
                      "play:",
                      out string battleCardId))
              {
                  message = "몬스터 소환 실패: 드래그한 카드를 찾을 수 없습니다.";
                  return true;
              }
              BattleCardPlayCommandResult command = battleScreen.TryPlayCard(
                  progress,
                  battleCardId,
                  position);
              message = command.Message;
              if (command.Succeeded)
              {
                  SaveRun(null);
              }
              finalCampaignScreen = null;
              finalBattleFieldSignature = null;
              if (campaign?.Phase == RunCampaignPhase.Battle)
              {
                  RefreshFinalBattle();
                  SetFinalUiActive(true);
                  FinalUiRoot.ShowScreen(RuntimeGameScreen.Battle);
              }
              else
              {
                  RefreshFinalUiVisibility();
              }
              return true;
          }

          private static bool TryResolveMonsterPosition(
              string slotText,
              out PlayerMonsterFieldPosition position)
          {
              position = default;
              if (!int.TryParse(slotText, out int index))
              {
                  return false;
              }
              switch (index)
              {
                  case 0:
                      position = PlayerMonsterFieldPosition.Left;
                      return true;
                  case 1:
                      position = PlayerMonsterFieldPosition.Center;
                      return true;
                  case 2:
                      position = PlayerMonsterFieldPosition.Right;
                      return true;
                  default:
                      return false;
              }
          }

          '''
              if marker not in text:
                  raise RuntimeError('BattleField signature marker missing')
              text = text.replace(marker, method + marker, 1)
              save(path, text)

          path = 'Assets/Editor/RuntimeBattleFieldBridgeValidation.cs'
          text = load(path)
          text = text.replace(
              'bool fieldDrops = monsterDropCount == 1 &&',
              'bool fieldDrops = monsterDropCount == 3 &&',
              1)
          text = text.replace(
              'selection and first-empty card-drop routing.',
              'selection and all-empty monster-zone card-drop routing.')
          save(path, text)

          report = Path('MonsterPlacementApiReport.txt')
          if report.exists():
              report.unlink()
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '몬스터존 선택 소환 명령을 전투 상태에 연결'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
