name: Add selected monster slot regression

on:
  pull_request:
    types: [reopened]
    branches:
      - codex/card-visual-foundation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Add right-slot summon assertion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Assets/Editor/BattlePlayerActionViewModelValidation.cs')
          text = path.read_text(encoding='utf-8')
          start = text.index('                BattleCardPlayCommandResult play =')
          end = text.index(
              '                BattleMonsterAttackActionOption monster =',
              start)
          block = text[start:end]
          if 'PlayerMonsterFieldPosition.Right);' not in block:
              marker = '                        c01.Ids.BattleCardId);'
              if marker not in block:
                  raise RuntimeError('C01 play call marker missing')
              block = block.replace(
                  marker,
                  '                        c01.Ids.BattleCardId,\n' +
                  '                        PlayerMonsterFieldPosition.Right);',
                  1)
          if 'runtime.PlayerMonsterPositions.GetOccupant(' not in block:
              marker = '                    string.IsNullOrWhiteSpace(play.Message) ||\n'
              if marker not in block:
                  raise RuntimeError('play message assertion marker missing')
              assertions = '''                    runtime.PlayerMonsterPositions.GetOccupant(
                          PlayerMonsterFieldPosition.Right) !=
                      c01.Ids.BattleCardId ||
                      !string.IsNullOrWhiteSpace(
                          runtime.PlayerMonsterPositions.GetOccupant(
                              PlayerMonsterFieldPosition.Left)) ||
                      !string.IsNullOrWhiteSpace(
                          runtime.PlayerMonsterPositions.GetOccupant(
                              PlayerMonsterFieldPosition.Center)) ||
          '''
              block = block.replace(marker, marker + assertions, 1)
          text = text[:start] + block + text[end:]
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '우측 몬스터존 선택 소환 회귀검사 추가'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
