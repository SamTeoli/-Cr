name: Format node selection methods once

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'agent/deck-selection-viewmodel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deck-selection-viewmodel
          fetch-depth: 0

      - name: Format node selection methods
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent, indent

          def replace_method(text, name, raw):
              start_token = f"        private void {name}("
              start = text.index(start_token)
              end = text.find("\n        private ", start + len(start_token))
              if end < 0:
                  raise RuntimeError(f"next method not found after {name}")
              replacement = indent(dedent(raw).strip(), "        ")
              return text[:start] + replacement + "\n" + text[end:]

          runtime_path = Path("Assets/Scripts/Prototype/RuntimePrototypeScreen.cs")
          runtime = runtime_path.read_text(encoding="utf-8")
          runtime = replace_method(runtime, "DrawNodeSelection", '''
          private void DrawNodeSelection()
          {
              GUILayout.Label("다음 노드 선택", headingStyle);
              RunNodeSelectionOption[] options =
                  nodeSelection.CreateOptions(campaign);
              foreach (RunNodeSelectionOption option in options)
              {
                  if (!GUILayout.Button(
                          option.InlineLabel,
                          GUILayout.Height(46f))) continue;
                  if (!nodeSelection.TrySelect(
                          campaign,
                          option.NodeId,
                          out RunNodeSelectionOption selected,
                          out RunCampaignFailure failure))
                  {
                      message = $"노드 선택 실패: {failure}";
                  }
                  else if (selected.IsBattle)
                  {
                      BeginSelectedBattle();
                  }
                  else
                  {
                      message = $"{selected.DisplayName} 노드에 들어왔습니다.";
                      SaveRun(null);
                  }
                  return;
              }
          }
          ''')
          runtime_path.write_text(runtime, encoding="utf-8")

          editor_path = Path("Assets/Editor/IntegratedRunPrototypeWindow.cs")
          editor = editor_path.read_text(encoding="utf-8")
          editor = replace_method(editor, "DrawNodeSelection", '''
          private void DrawNodeSelection()
          {
              EditorGUILayout.LabelField("다음 노드 선택", EditorStyles.boldLabel);
              EditorGUILayout.BeginHorizontal();
              RunNodeSelectionOption[] options =
                  nodeSelection.CreateOptions(campaign);
              foreach (RunNodeSelectionOption option in options)
              {
                  if (GUILayout.Button(
                          option.StackedLabel,
                          GUILayout.MinHeight(62f)))
                  {
                      if (!nodeSelection.TrySelect(
                              campaign,
                              option.NodeId,
                              out RunNodeSelectionOption selected,
                              out RunCampaignFailure failure))
                      {
                          message = $"노드 선택 실패: {failure}";
                      }
                      else if (selected.IsBattle)
                      {
                          BeginSelectedBattle();
                      }
                      else
                      {
                          message = $"{selected.DisplayName} 노드에 들어왔습니다.";
                          SaveRun(null);
                      }
                      EditorGUILayout.EndHorizontal();
                      return;
                  }
              }

              EditorGUILayout.EndHorizontal();
          }
          ''')
          editor_path.write_text(editor, encoding="utf-8")
          PY

          rm -f .github/workflows/format-node-selection-methods-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/Scripts/Prototype/RuntimePrototypeScreen.cs \
                  Assets/Editor/IntegratedRunPrototypeWindow.cs \
                  .github/workflows/format-node-selection-methods-once.yml
          git diff --cached --check
          git commit -m "노드 선택 화면 형식 정리"
          git push origin HEAD:agent/deck-selection-viewmodel
