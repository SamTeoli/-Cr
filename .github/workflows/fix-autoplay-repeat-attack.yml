name: Fix autoplay repeat attack
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.pull_request.head.ref == 'agent/battle-autoplay-e2e'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/battle-autoplay-e2e
          fetch-depth: 0
      - name: Apply fix
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path('Assets/Scripts/Prototype/BattleAutoplayViewModel.cs')
          text = path.read_text(encoding='utf-8')
          marker = '        private BattleAutoplayCommandResult ResolveAttacks('
          start = text.index(marker)
          end = text.index('        private BattleEnemyDisplayOption SelectPreferredEnemy(', start)
          method = text[start:end]
          method, count = re.subn(
              r'(\n        \{\n)(            for \(int index = 0; index < limit; index\+\+\))',
              r'\1            HashSet<string> attemptedAttackers =\n                new(StringComparer.OrdinalIgnoreCase);\n\2',
              method,
              count=1)
          if count != 1:
              raise SystemExit('failed to insert attemptedAttackers')
          method, count = re.subn(
              r'\.Where\(value => value != null && value\.CanAttack\)',
              '.Where(value => value != null && value.CanAttack &&\n                        !attemptedAttackers.Contains(value.BattleCardId))',
              method,
              count=1)
          if count != 1:
              raise SystemExit('failed to update attacker filter')
          method, count = re.subn(
              r'(                BattleMonsterAttackCommandResult command =\n                    battleScreen\.TryAttack\(progress, attacker\.BattleCardId\);)',
              '                attemptedAttackers.Add(attacker.BattleCardId);\n\\1',
              method,
              count=1)
          if count != 1:
              raise SystemExit('failed to add attempted attacker record')
          path.write_text(text[:start] + method + text[end:], encoding='utf-8')
      - name: Remove workflow
        run: rm .github/workflows/fix-autoplay-repeat-attack.yml
      - name: Validate and commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "자동 진행 중복 몬스터 공격 방지"
          git push origin HEAD:agent/battle-autoplay-e2e
