name: Fix battle start validation once

on:
  pull_request:
    types: [reopened]
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  fix:
    if: >-
      (github.event_name == 'pull_request' &&
       github.head_ref == 'agent/battle-start-viewmodel') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 90 &&
       github.event.comment.body == '/fix-battle-start-validation')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/battle-start-viewmodel
          fetch-depth: 0
      - name: Initialize validation locals
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("Assets/Editor/BattleStartCommandFlowValidation.cs")
          text = path.read_text(encoding="utf-8")
          old = '''                IReadOnlyList<string> pool = config.GetEncounterPool(grade, 0);
                if (pool == null || pool.Count == 0 ||
                    !RunEncounterPoolService.TryResolve(
                        config.EncounterDatabase,
                        pool,
                        grade,
                        700 + index,
                        out EncounterData encounter,
                        out string error) ||
                    encounter == null || !string.IsNullOrWhiteSpace(error))
'''
          new = '''                IReadOnlyList<string> pool = config.GetEncounterPool(grade, 0);
                EncounterData encounter = null;
                string error = null;
                if (pool == null || pool.Count == 0 ||
                    !RunEncounterPoolService.TryResolve(
                        config.EncounterDatabase,
                        pool,
                        grade,
                        700 + index,
                        out encounter,
                        out error) ||
                    encounter == null || !string.IsNullOrWhiteSpace(error))
'''
          if old not in text:
              raise SystemExit("Target validation block was not found.")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-battle-start-validation-once.yml
          git add Assets/Editor/BattleStartCommandFlowValidation.cs
          git diff --cached --check
          git commit -m "전투 시작 검증 지역 변수 초기화"
          git push origin HEAD:agent/battle-start-viewmodel
