name: Fix autoplay attack once

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/battle-autoplay-e2e'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/battle-autoplay-e2e
          fetch-depth: 0
      - name: Patch autoplay attack tracking
        shell: python
        run: |
          from pathlib import Path

          path = Path('Assets/Scripts/Prototype/BattleAutoplayViewModel.cs')
          text = path.read_text(encoding='utf-8')
          old = '''        {
            for (int index = 0; index < limit; index++)
            {
                BattleScreenSnapshot snapshot =
                    battleScreen.CreateSnapshot(progress, campaign);
                if (snapshot?.SessionFinished == true)
                {
                    return null;
                }

                BattleEnemyDisplayOption target = SelectPreferredEnemy(
                    snapshot,
                    progress);
                if (target == null)
                {
                    return null;
                }

                BattleMonsterDisplayOption attacker = snapshot.Monsters
                    .Where(value => value != null && value.CanAttack)
                    .OrderBy(value => value.Position)
                    .FirstOrDefault();
                if (attacker == null)
                {
                    return null;
                }

                BattleMonsterAttackCommandResult command =
                    battleScreen.TryAttack(progress, attacker.BattleCardId);
                if (command == null || !command.Succeeded)
                {
                    return Failure(
                        BattleAutoplayFailure.AttackActionFailed,
                        progress,
                        turnsCompleted,
                        cardsPlayed,
                        attacksResolved,
                        consumablesUsed,
                        "전투 자동 진행 실패: 몬스터 공격 명령 실패 · " +
                        (command?.Message ?? attacker.BattleCardId));
                }

                attacksResolved++;
                actionsThisTurn++;
            }

            return null;
        }
'''
          new = '''        {
            HashSet<string> attackedThisTurn =
                new(StringComparer.OrdinalIgnoreCase);
            for (int index = 0; index < limit; index++)
            {
                BattleScreenSnapshot snapshot =
                    battleScreen.CreateSnapshot(progress, campaign);
                if (snapshot?.SessionFinished == true)
                {
                    return null;
                }

                BattleEnemyDisplayOption target = SelectPreferredEnemy(
                    snapshot,
                    progress);
                if (target == null)
                {
                    return null;
                }

                BattleMonsterDisplayOption attacker = snapshot.Monsters
                    .Where(value => value != null && value.CanAttack &&
                        !attackedThisTurn.Contains(value.BattleCardId))
                    .OrderBy(value => value.Position)
                    .FirstOrDefault();
                if (attacker == null)
                {
                    return null;
                }

                BattleMonsterAttackCommandResult command =
                    battleScreen.TryAttack(progress, attacker.BattleCardId);
                if (command == null || !command.Succeeded)
                {
                    return Failure(
                        BattleAutoplayFailure.AttackActionFailed,
                        progress,
                        turnsCompleted,
                        cardsPlayed,
                        attacksResolved,
                        consumablesUsed,
                        "전투 자동 진행 실패: 몬스터 공격 명령 실패 · " +
                        (command?.Message ?? attacker.BattleCardId));
                }

                attackedThisTurn.Add(attacker.BattleCardId);
                attacksResolved++;
                actionsThisTurn++;
            }

            return null;
        }
'''
          if old not in text:
              raise SystemExit('target block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Remove one-time workflow
        run: git rm .github/workflows/fix-autoplay-attack-once.yml
      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/Scripts/Prototype/BattleAutoplayViewModel.cs
          git commit -m "전투 자동 진행의 턴당 중복 공격 방지"
          git push origin HEAD:agent/battle-autoplay-e2e
