name: Fix battle reward out parameters once

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/deck-selection-viewmodel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deck-selection-viewmodel
          fetch-depth: 0

      - name: Initialize reward failure outputs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Assets/Scripts/Prototype/RunBattleRewardViewModel.cs")
          text = path.read_text(encoding="utf-8")

          old_enchant = (
              "            claimed = null;\n"
              "            result = null;\n"
              "            attachmentFailure = default;\n"
              "            BattleRuntimeEncounterContext context = progress?.ActiveEncounter;\n"
          )
          new_enchant = (
              "            claimed = null;\n"
              "            result = null;\n"
              "            attachmentFailure = default;\n"
              "            failure = default;\n"
              "            BattleRuntimeEncounterContext context = progress?.ActiveEncounter;\n"
          )
          if text.count(old_enchant) != 1:
              raise RuntimeError(
                  f"enchant output initialization: expected one match, found {text.count(old_enchant)}")
          text = text.replace(old_enchant, new_enchant, 1)

          old_consumable = (
              "            claimed = null;\n"
              "            result = null;\n"
              "            BattleRuntimeEncounterContext context = progress?.ActiveEncounter;\n"
          )
          new_consumable = (
              "            claimed = null;\n"
              "            result = null;\n"
              "            failure = default;\n"
              "            BattleRuntimeEncounterContext context = progress?.ActiveEncounter;\n"
          )
          if text.count(old_consumable) != 1:
              raise RuntimeError(
                  f"consumable output initialization: expected one match, found {text.count(old_consumable)}")
          text = text.replace(old_consumable, new_consumable, 1)

          path.write_text(text, encoding="utf-8")
          PY

          rm -f .github/workflows/fix-battle-reward-out-parameters-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/Scripts/Prototype/RunBattleRewardViewModel.cs \
                  .github/workflows/fix-battle-reward-out-parameters-once.yml
          git diff --cached --check
          git commit -m "전투 보상 out 매개변수 초기화"
          git push origin HEAD:agent/deck-selection-viewmodel
